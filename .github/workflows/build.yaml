'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: 
name: Build
jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      matrix:
        include:
        - name: macos-latest - Deti full jvm and android
          os: macos-latest
          setup_graalvm: false
          run: |
            ./gradlew :quickjs:publishJvmPublicationToMavenLocal :quickjs:publishAndroidPublicationToMavenLocal :quickjs:jvmTest --no-configuration-cache
      fail-fast: false
    runs-on: "${{ matrix.os }}"
    env:
      ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: false
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Setup GraalVM
      if: matrix.setup_graalvm
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: graalvm-community
        github-token: "${{ secrets.GITHUB_TOKEN }}"
        native-image-job-reports: 'true'
    - name: Export GRAALVM_HOME
      if: matrix.setup_graalvm
      shell: bash
      run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Setup JDK
      if: "${{ !matrix.setup_graalvm }}"
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2.2
    - name: Setup ninja-build
      uses: seanmiddleditch/gha-setup-ninja@master
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.12.0
    - uses: gradle/actions/setup-gradle@v6
    - name: Grant execute permission for scripts
      if: runner.os != 'Windows'
      run: |
        chmod +x gradlew
        chmod +x quickjs/native/cmake/zig-ar.sh
        chmod +x quickjs/native/cmake/zig-ranlib.sh
    - name: Build
      shell: bash
      run: "${{ matrix.run }}"
    - name: Deti upload maven artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quickjs-kt-maven
        path: "~/.m2/repository/io/github/dokar3/"
        retention-days: 30
        if-no-files-found: error
