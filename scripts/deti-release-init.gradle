// Deti release: adds a local-file publishing repository named 'DetiRepo' to every project
// with maven-publish. Publish tasks targeting it keep the release semantics of the native
// build (buildQuickJsJniLibs compiles the JNI library for all supported platforms), while
// the *ToMavenLocal tasks only build the host native library.
gradle.projectsEvaluated { gradle ->
    gradle.rootProject.allprojects { project ->
        if (project.plugins.hasPlugin('maven-publish')) {
            project.extensions.getByType(org.gradle.api.publish.PublishingExtension).repositories.maven { repo ->
                repo.name = 'DetiRepo'
                repo.url = project.rootProject.file('build/deti-maven-repo')
            }
        }
    }
}
